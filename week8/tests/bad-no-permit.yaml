# bad-no-permit: breaks one rule - at least one permit entry: every entry is deny
# intent.yaml: what the lab API should hold, for the Week 7 assignment. Your sync.py makes it so.
#
# Replace 4207 with the last 4 digits of your student ID, and every 10.7. with 10.NN.,
# where NN is the last 2 digits (as a number: 07 → 7). Then make it your own network's intent.
#
# Requirements:
#   - at least 6 VLANs (ids 2 to 4094 — VLAN 1 belongs to the API), each with a name
#     (1 to 32 letters, digits, '-' or '_');
#   - at least 4 ACL entries, on your own addresses (10.NN.0.0/16), including at least one
#     permit and one deny, and at least one with a port (tcp or udp only).
# Anything on the API that ISN'T here is removed by sync.py (except VLAN 1): this file is the
# whole truth, like Week 2's network.yaml.
#
# My network (ID …3540, NN = 40): VLAN n uses the subnet 10.40.n.0/24.
# Against a fresh API (VLANs 1 default, 10 users, 20 servers, 99 old-guest; no ACL) this intent
# renames VLAN 10, keeps VLAN 20, creates 30/40/50/60, deletes 99 and adds all 5 ACL entries.

student_id_last4: "3540"

vlans:
  - {id: 10, name: staff}        # 10.40.10.0/24  staff PCs        (fresh API calls it "users": renamed)
  - {id: 20, name: servers}      # 10.40.20.0/24  servers          (already right: no change)
  - {id: 30, name: guests}       # 10.40.30.0/24  guest Wi-Fi
  - {id: 40, name: voice}        # 10.40.40.0/24  IP phones
  - {id: 50, name: mgmt}         # 10.40.50.0/24  network management
  - {id: 60, name: iot}          # 10.40.60.0/24  cameras and sensors

# The order matters: an ACL is checked top to bottom, so sync.py keeps entries in this order.
acl:
  - {action: deny, src: 10.40.10.0/24, dst: 10.40.20.0/24, protocol: tcp, port: 443, description: staff-to-servers-https}
  - {action: deny, src: 10.40.30.0/24, dst: 10.40.20.0/24, protocol: tcp, port: 22, description: guests-no-ssh}
  - {action: deny, src: 10.40.40.0/24, dst: 10.40.20.0/24, protocol: udp, port: 5060, description: voice-to-sip-server}
  - {action: deny, src: 10.40.60.0/24, dst: 10.40.50.0/24, protocol: any, description: iot-no-mgmt}
  - {action: deny, src: 10.40.50.0/24, dst: 10.40.0.0/16, protocol: icmp, description: mgmt-can-ping-all}
